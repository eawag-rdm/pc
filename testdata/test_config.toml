#####################################################################################
# README
# ------
# Checks are configured as rules: each [[rule]] is one named instance of a
# check with its own file selector (include/exclude = RE2 regexes, matched
# unanchored, case-sensitive unless ignoreCase = true, against subject "name"
# or "path"; exclude wins) and its own [rule.params] (repeated [[rule.params]]
# = several parameter sets on one rule). keywords / disallowed_names /
# readme_names are literal strings, never regexes. A check without any rule
# runs with its defaults (IsFreeOfKeywords, IsValidName and HasReadme must be
# declared); HasNoWhiteSpace, HasFileNameSpecialChars, IsFileNameTooLong and
# ReadMeContainsTOC are left rule-less here on purpose - they pin default-rule
# synthesis.
#####################################################################################

[general]
# Max unpack-candidate members per archive for content checks
maxArchiveMemberCount = 1000
# Page ceiling per PDF (longer PDFs are skipped whole)
maxPDFPages = 10
# Max PDF size in bytes (larger PDFs are not read)
maxPDFFileSize = 1048576
summaryIntroText = "Test config intro text."
summaryMaxIssuesBeforeTruncation = 5
summaryMinGroupSizeForTruncation = 3

[server]
# pc-server HTTP API settings. Most values mirror the built-in defaults;
# allowedOrigins is illustrative (the built-in default is empty/nil).
listenAddress           = "127.0.0.1:8080"
trustProxyHeaders       = true
trustedProxies          = ["127.0.0.1/32"]
allowedOrigins          = ["http://localhost:3000"]
perIPRequestsPerHour    = 4
globalRequestsPerHour   = 20
burstFactor             = 0.5
analysisBusyWaitSeconds = 2
maxTrackedRateKeys      = 10000
contactMessage          = "If you can't resolve this yourself, please contact rdm@eawag.ch."
logClientIP             = true
requestTimeoutSeconds   = 300

# Admin-alert relay (sub-section of [server]); host empty = disabled, mirroring
# the built-in default. No mail is attempted in tests.
[server.smtp]
host = ""
port = 25
from = "pc-server@eawag.ch"
to   = ["rdm@eawag.ch"]

[operation.main]
collector = "LocalCollector"

[[rule]]
# Non-ASCII characters in folder and file names
name    = "ascii-names"
check   = "HasOnlyASCII"
exclude = ["test.txt"]

[[rule]]
# Sensitive content in file contents; selector kept narrow for the fixtures.
# ONE keyword rule carrying three [[rule.params]] groups, so the archive path
# takes the single-member-rule admission.
name    = "sensitive-content"
check   = "IsFreeOfKeywords"
include = ["b"]
  [[rule.params]]
  keywords = ["user", "id_rsa", "password"]
  info     = "Possible credentials in file"
  [[rule.params]]
  keywords = ["Q:"]
  info     = "Possible internal information in file"
  [[rule.params]]
  keywords = ["/Users/"]
  info     = "Do you have hardcoded filepaths in your files?  Found suspicious keyword(s):"

[[rule]]
# Secret scan via betterleaks; disabled in tests (no scanner binary in CI).
# The keyword rules above stay: they exercise the keyword-check machinery.
name    = "secret-scan"
check   = "IsFreeOfSecrets"
enabled = false
  [rule.params]
  binary = "betterleaks"
  timeoutSeconds = 120
  maxProcs = 3

[[rule]]
# The repository readme must be present; which filenames count is the check's
# built-in default list. ReadMeContainsTOC reads this rule.
name  = "readme-present"
check = "HasReadme"

[[rule]]
# Disallowed file/folder names (literal strings, exact or suffix match)
name  = "no-junk-files"
check = "IsValidName"
  [rule.params]
  disallowed_names = [
      ".Rhistory", ".RData",
      ".Rapp.history", ".Ruserdata",
      ".Rbuildignore", "__pycache__", ".vscode",
      ".ipynb_checkpoints", "venv", ".idea", ".egg-info",
      ".pytest_cache", ".pyc", ".tox", ".python_version",
      ".coverage", ".benchmark"
  ]

[collector.CkanCollector]
attrs = {url = "https://example.com", token = "", verify = true, ckan_storage_path = "/nfsmount/ckan/default"}

[collector.LocalCollector]
attrs = {includeFolders = true}
