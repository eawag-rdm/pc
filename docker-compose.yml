# docker-compose for pc-server.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ IMPORTANT: these settings MUST stay aligned with pc.toml.                 │
# │                                                                           │
# │ 1. PORT - the container side of `ports` below must equal the port in      │
# │    [server] listenAddress in pc.toml, AND that listenAddress must bind    │
# │    0.0.0.0 (NOT 127.0.0.1) so the server is reachable from outside the    │
# │    container, e.g.  listenAddress = "0.0.0.0:8080".                       │
# │                                                                           │
# │ 2. STORAGE PATH - the TARGET of the CKAN-storage volume below must equal  │
# │    [collector.CkanCollector].attrs.ckan_storage_path in pc.toml.          │
# │                                                                           │
# │ 3. SMTP - if [server.smtp] is enabled, its host must be reachable from    │
# │    inside this container's network.                                       │
# │                                                                           │
# │ 4. USER - the PC_UID / PC_GID build args (below) bake the server's user;  │
# │    set them to the CKAN storage share's owner uid:gid so it is readable.   │
# └─────────────────────────────────────────────────────────────────────────┘

services:
  pc-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # uid:gid the server runs as. Set these to the OWNER of the CKAN storage
        # share so the read-only mount is readable. Baked into the image's `pc`
        # user at build time, so change them here and rebuild (docker compose
        # build / up --build).
        PC_UID: "503"
        PC_GID: "502"
    image: pc-server:latest
    restart: unless-stopped
    networks:
      - default        # keep! naming networks explicitly removes the
      - eric-webnet    # implicit default one otherwise
    ports:
      # host:container - the CONTAINER port must equal the [server] listenAddress
      # port in pc.toml. Bind on host-localhost when nginx terminates in front of
      # it; use "0.0.0.0:8080:8080" (or just "8080:8080") to expose it directly.
      - "0.0.0.0:8080:8080"

    volumes:
      # 1) pc.toml - READ-ONLY. The server reads ALL configuration from here.
      - ./pc.toml:/etc/pc/pc.toml:ro
      # 2) CKAN storage network share - READ-ONLY. The TARGET path here MUST
      #    equal [collector.CkanCollector].attrs.ckan_storage_path in pc.toml.
      #    Left side: where the network share is mounted on the host.
      - /nfsmount/ckan/default:/nfsmount/ckan/default:ro
      # 3) Server state - named volume. Holds the result cache (only used when
      #    [server] resultCacheDir is set; it must then point INSIDE this
      #    target, e.g. resultCacheDir = "/var/lib/pc/cache") and the wasm
      #    cache below, which IS meant to persist across container recreations.
      #    The result cache is not: the server wipes its entries subdir at
      #    every start (and refuses to start if it cannot). A named volume (not
      #    a bind mount) keeps the cached analyses - which can contain
      #    private-package findings - inside Docker-managed storage with the
      #    container user's ownership.
      - pc-cache:/var/lib/pc

    # Wazero compilation cache for the PDF engine lands under XDG_CACHE_HOME;
    # pointing it into the persistent volume avoids a ~3 s wasm recompile on
    # every container recreation (the container home is ephemeral).
    environment:
      - XDG_CACHE_HOME=/var/lib/pc

    # RAM-backed /tmp: the IsFreeOfSecrets check extracts archive members here
    # before scanning, so plaintext copies never touch disk. Size it to at least
    # the worst-case extraction (archives per analysis x maxTotalArchiveMemory).
    tmpfs:
      - /tmp:size=2g,mode=1777

    healthcheck:
      # /health is a cheap liveness probe (static 200, no upstream I/O). The URL
      # port must match the [server] listenAddress port in pc.toml.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # drain (requestTimeoutSeconds + 30s) + 10s slack; raise together. Best-effort - SIGKILL is the backstop.
    stop_grace_period: 10s

    # Logs are JSON on stdout; Docker handles rotation (spec §8).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
   eric-webnet:
     external: true
     name: eric_webnet    # from step 1

# Named volume backing the result cache mount above.
volumes:
  pc-cache:

# Alternative to the host bind-mount above: let Docker mount the NFS share
# directly as a named volume. The container path in `volumes:` stays the same
# and must still equal ckan_storage_path in pc.toml.
#
#   volumes:
#     - ckan-storage:/nfsmount/ckan/default:ro
#
# volumes:
#   ckan-storage:
#     driver: local
#     driver_opts:
#       type: nfs
#       o: "addr=NFS_SERVER,ro,nfsvers=4"
#       device: ":/export/ckan/storage"
